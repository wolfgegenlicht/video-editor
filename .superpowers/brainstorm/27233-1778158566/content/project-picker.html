<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProjectPicker Redesign</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; background: #e2e8f0; min-height: 100vh; padding: 24px; }

  .label-pill {
    display: inline-block;
    background: #0d9488;
    color: white;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 12px;
  }
  h2 { font-size: 15px; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
  .sub { font-size: 12px; color: #64748b; margin-bottom: 20px; }

  .shell {
    background: #f8fafc;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    max-width: 820px;
    margin: 0 auto;
  }

  /* Top bar */
  .topbar {
    height: 52px;
    background: #ffffff;
    border-bottom: 1px solid #e2e8f0;
    display: flex;
    align-items: center;
    padding: 0 28px;
    gap: 12px;
  }
  .logo-mark {
    width: 26px; height: 26px;
    background: #0d9488;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
  }
  .logo-mark svg { opacity: 0.95; }
  .app-name {
    font-size: 14px;
    font-weight: 700;
    color: #0f172a;
    letter-spacing: -0.02em;
  }

  /* Content area */
  .content {
    padding: 32px 28px;
  }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .section-title {
    font-size: 18px;
    font-weight: 700;
    color: #0f172a;
    letter-spacing: -0.02em;
  }
  .new-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #0d9488;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.01em;
  }

  /* Project grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }

  /* Project card */
  .project-card {
    background: #ffffff;
    border-radius: 10px;
    border: 1px solid #e2e8f0;
    overflow: hidden;
    cursor: pointer;
    transition: box-shadow 0.15s, border-color 0.15s, transform 0.1s;
    position: relative;
  }
  .project-card:hover {
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    border-color: #cbd5e1;
    transform: translateY(-1px);
  }
  .card-thumb {
    aspect-ratio: 16/9;
    background: #f1f5f9;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid #f1f5f9;
    position: relative;
    overflow: hidden;
  }
  .card-thumb-gradient {
    position: absolute; inset: 0;
    opacity: 0.5;
  }
  .card-thumb-icon {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(255,255,255,0.8);
    display: flex; align-items: center; justify-content: center;
    position: relative; z-index: 1;
  }
  .card-body { padding: 10px 12px 12px; }
  .card-name { font-size: 12px; font-weight: 600; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
  .card-date { font-size: 10px; color: #94a3b8; }

  .card-menu-btn {
    position: absolute;
    top: 6px; right: 6px;
    width: 22px; height: 22px;
    border-radius: 5px;
    background: rgba(255,255,255,0.85);
    border: 1px solid rgba(0,0,0,0.08);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    color: #475569;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .project-card:hover .card-menu-btn { opacity: 1; }

  /* New project card */
  .new-card {
    background: transparent;
    border-radius: 10px;
    border: 2px dashed #cbd5e1;
    aspect-ratio: auto;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .new-card:hover {
    border-color: #0d9488;
    background: #f0fdfa;
  }
  .new-card-icon {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1.5px solid #cbd5e1;
    display: flex; align-items: center; justify-content: center;
    color: #94a3b8;
    transition: border-color 0.15s, color 0.15s;
  }
  .new-card:hover .new-card-icon {
    border-color: #0d9488;
    color: #0d9488;
  }
  .new-card-label { font-size: 11px; font-weight: 600; color: #94a3b8; transition: color 0.15s; }
  .new-card:hover .new-card-label { color: #0d9488; }
</style>
</head>
<body>

<div class="label-pill">Design Section 2 of 3 — Project Picker</div>
<h2>Project Picker — Light Mode</h2>
<p class="sub">Consistent with the editor. Clean card grid, teal CTA, subtle hover states.</p>

<div class="shell">

  <div class="topbar">
    <div class="logo-mark">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="1" y="3" width="12" height="9" rx="2"/>
        <path d="M5 6l4 2.5L5 11V6z" fill="white" stroke="none"/>
      </svg>
    </div>
    <span class="app-name">Video Editor</span>
  </div>

  <div class="content">
    <div class="section-header">
      <h1 class="section-title">Projects</h1>
      <button class="new-btn">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M6 1v10M1 6h10"/></svg>
        New Project
      </button>
    </div>

    <div class="grid">

      <!-- Project 1 -->
      <div class="project-card">
        <div class="card-thumb">
          <div class="card-thumb-gradient" style="background:linear-gradient(135deg,#0d9488,#059669);"></div>
          <div class="card-thumb-icon">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="2,1 11,6 2,11"/></svg>
          </div>
        </div>
        <div class="card-body">
          <div class="card-name">Product Demo v2</div>
          <div class="card-date">Today</div>
        </div>
        <button class="card-menu-btn">···</button>
      </div>

      <!-- Project 2 -->
      <div class="project-card">
        <div class="card-thumb">
          <div class="card-thumb-gradient" style="background:linear-gradient(135deg,#6366f1,#8b5cf6);"></div>
          <div class="card-thumb-icon">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="2,1 11,6 2,11"/></svg>
          </div>
        </div>
        <div class="card-body">
          <div class="card-name">Interview — Sarah</div>
          <div class="card-date">Yesterday</div>
        </div>
        <button class="card-menu-btn">···</button>
      </div>

      <!-- Project 3 -->
      <div class="project-card">
        <div class="card-thumb">
          <div class="card-thumb-gradient" style="background:linear-gradient(135deg,#f59e0b,#f97316);"></div>
          <div class="card-thumb-icon">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="2,1 11,6 2,11"/></svg>
          </div>
        </div>
        <div class="card-body">
          <div class="card-name">Explainer Draft</div>
          <div class="card-date">3 days ago</div>
        </div>
        <button class="card-menu-btn">···</button>
      </div>

      <!-- New project card -->
      <div class="new-card">
        <div class="new-card-icon">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 1v12M1 7h12"/></svg>
        </div>
        <span class="new-card-label">New Project</span>
      </div>

    </div>
  </div>

</div>

</body>
</html>
